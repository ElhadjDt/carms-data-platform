<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CaRMS Lookup — Browse programs</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="page">

  <header>
    <a class="wordmark" href="index.html">CaRMS <span>Lookup</span></a>
    <nav class="tabs">
      <a href="index.html">Ask a question</a>
      <a href="programs.html" aria-current="page">Browse programs</a>
    </nav>
  </header>

  <div class="filter-row">
    <input class="search-input" id="search" type="text" placeholder="Search by program, school, or site…" autocomplete="off" />
    <select class="filter-select" id="discipline-filter">
      <option value="">All disciplines</option>
    </select>
  </div>

  <p class="result-count" id="result-count">Loading programs…</p>
  <ul class="source-list" id="program-list"></ul>
  <button class="load-more" id="load-more" type="button" hidden>Show more</button>

  <footer>
    <span id="total-count"></span>
    <span><a href="/docs" style="color:inherit">API docs</a></span>
  </footer>

</div>

<script>
  const PAGE_SIZE = 40;
  let allPrograms = [];
  let filtered = [];
  let shown = 0;

  const searchInput = document.getElementById('search');
  const disciplineFilter = document.getElementById('discipline-filter');
  const list = document.getElementById('program-list');
  const resultCount = document.getElementById('result-count');
  const totalCount = document.getElementById('total-count');
  const loadMoreBtn = document.getElementById('load-more');

  function renderCard(p) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.className = 'source-card';
    a.href = p.program_url;
    a.target = '_blank';
    a.rel = 'noopener';

    const textWrap = document.createElement('span');
    textWrap.className = 'source-text';

    const name = document.createElement('span');
    name.className = 'source-name';
    name.textContent = p.program_name;

    const meta = document.createElement('span');
    meta.className = 'source-meta';
    meta.textContent = p.discipline_name + ' · ' + p.school_name + ' · ' + p.program_site + ' · ' + p.program_stream;

    textWrap.appendChild(name);
    textWrap.appendChild(meta);

    const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    arrow.setAttribute('class', 'source-arrow');
    arrow.setAttribute('width', '14');
    arrow.setAttribute('height', '14');
    arrow.setAttribute('viewBox', '0 0 24 24');
    arrow.setAttribute('fill', 'none');
    arrow.setAttribute('stroke', 'currentColor');
    arrow.setAttribute('stroke-width', '2');
    arrow.setAttribute('stroke-linecap', 'round');
    arrow.setAttribute('stroke-linejoin', 'round');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', 'M7 17L17 7M17 7H8M17 7v9');
    arrow.appendChild(path);

    a.appendChild(textWrap);
    a.appendChild(arrow);
    li.appendChild(a);
    return li;
  }

  function renderPage(reset) {
    if (reset) {
      list.innerHTML = '';
      shown = 0;
    }
    const next = filtered.slice(shown, shown + PAGE_SIZE);
    next.forEach(function (p) { list.appendChild(renderCard(p)); });
    shown += next.length;
    resultCount.textContent = filtered.length + (filtered.length === 1 ? ' program' : ' programs') +
      (filtered.length !== allPrograms.length ? ' (of ' + allPrograms.length + ')' : '');
    loadMoreBtn.hidden = shown >= filtered.length;
  }

  function applyFilters() {
    const q = searchInput.value.trim().toLowerCase();
    const disciplineId = disciplineFilter.value;
    filtered = allPrograms.filter(function (p) {
      if (disciplineId && String(p.discipline_id) !== disciplineId) return false;
      if (!q) return true;
      return (
        p.program_name.toLowerCase().includes(q) ||
        p.school_name.toLowerCase().includes(q) ||
        p.program_site.toLowerCase().includes(q) ||
        p.discipline_name.toLowerCase().includes(q)
      );
    });
    renderPage(true);
  }

  searchInput.addEventListener('input', applyFilters);
  disciplineFilter.addEventListener('change', applyFilters);
  loadMoreBtn.addEventListener('click', function () { renderPage(false); });

  async function init() {
    try {
      const [programsRes, disciplinesRes] = await Promise.all([
        fetch('/programs/'),
        fetch('/disciplines/'),
      ]);
      allPrograms = await programsRes.json();
      const disciplines = await disciplinesRes.json();

      disciplines
        .slice()
        .sort(function (a, b) { return a.discipline_name.localeCompare(b.discipline_name); })
        .forEach(function (d) {
          const opt = document.createElement('option');
          opt.value = String(d.discipline_id);
          opt.textContent = d.discipline_name;
          disciplineFilter.appendChild(opt);
        });

      totalCount.textContent = allPrograms.length + ' programs across ' + disciplines.length + ' disciplines';
      filtered = allPrograms;
      renderPage(true);
    } catch (err) {
      resultCount.textContent = 'Could not load programs: ' + err.message;
    }
  }

  init();
</script>
</body>
</html>
